[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/vip"
  to = "/vip.html"
  status = 200

[[redirects]]
  from = "/grupo"
  to = "/vip.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
